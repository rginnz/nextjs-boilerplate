<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" width="200" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RG Energy Integrations - Integration Hub Icon</title>
  <desc>Central integration hub connecting multiple device types and protocols</desc>

  <!-- Central hub circle -->
  <circle cx="100" cy="120" r="20" fill="white" stroke="#0F3D7B" stroke-width="4"/>

  <!-- Top triangle branch (solar controller, monitoring system) -->
  <line x1="100" y1="95" x2="100" y2="30" stroke="#0F3D7B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 80 15 L 100 0 L 120 15 Z" fill="white" stroke="#0F3D7B" stroke-width="4" stroke-linejoin="round"/>

  <!-- Left circle branch (CSIP, Modbus, proprietary protocol) -->
  <line x1="82" y1="110" x2="25" y2="80" stroke="#0F3D7B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15" cy="75" r="16" fill="white" stroke="#0F3D7B" stroke-width="4"/>

  <!-- Right square branch (REST API, cloud integration) -->
  <line x1="118" y1="110" x2="170" y2="70" stroke="#0F3D7B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="54" width="30" height="30" fill="white" stroke="#0F3D7B" stroke-width="4" rx="4"/>

  <!-- Bottom circle branch (unified output, additional system) -->
  <line x1="100" y1="145" x2="100" y2="220" stroke="#0F3D7B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="240" r="16" fill="white" stroke="#0F3D7B" stroke-width="4"/>
</svg>